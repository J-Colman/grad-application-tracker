[project]
name = "grad-application-tracker"
version = "0.1.0"
description = "An application that records graduate opportunities, finds upcoming deadlines and tracks graduate applications."
readme = "README.md"
authors = [
    { name = "Joshua Colman", email = "j.a.colman03@gmail.com" }
]
requires-python = ">=3.14.5"
dependencies = []

[project.scripts]
grad-application-tracker = "grad_application_tracker:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
